<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app run under the notch and gesture bar; the CSS keeps content clear of them -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser and OS bars follow the app's light or dark theme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ebebe8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Order ahead for pickup at the counter, or have it delivered." />

    <!-- Installed to the home screen: opens full screen with its own name and icon.
         The manifest link is added by vite-plugin-pwa at build time (vite.config.ts). -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The app draws under the iPhone status bar (its own light or dark top shows through);
         the CSS pads content by env(safe-area-inset-top) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MEGS'" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font loads without holding up the first paint (system font until it arrives) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
    </noscript>
    <title>MEGS' Cafe</title>
    <!-- Settings → Appearance: a forced light or dark theme applies before anything paints -->
    <script>
      try {
        var t = localStorage.getItem('megs.theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', t === 'dark' ? '#121212' : '#ebebe8')
          })
        }
      } catch (e) {}
    </script>
    <!-- App shell painted before the JavaScript arrives; React replaces it -->
    <style>
      .boot { min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 12px;
        background: #ebebe8; color: #141414; font: 700 20px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .boot img { border-radius: 50%; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot { background: #121212; color: #f2f2ef; } }
      :root[data-theme='dark'] .boot { background: #121212; color: #f2f2ef; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="./icons/icon-192.png" alt="" width="40" height="40" />MEGS' Cafe</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
